<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            padding: 40px;
            font-family: Arial, sans-serif;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: #f2a2a2; 
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.5s ease;
        }

        .square1:hover {
            width: 350px;
        }

        .square2:hover {
            width: 150px;
            height: 150px;
        }
    </style>
</head>
<body>

    <p class="square square1">1</p>
    <p class="square square2">2</p>

</body>
</html>
