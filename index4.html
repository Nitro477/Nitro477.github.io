<html>
<head>
    <style>
        body {
            font-family: serif;
            padding: 20px;
        }

        .box {
            width: 500px;
            padding: 10px;
            margin: 15px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .box1 {
            background-color: #b0e0e6;
            border: 4px double red;
            color: black;
        }

        .box2 {
            background-color: yellow;
            border: 1px solid DodgerBlue;
            border-radius: 15px;
            color: black;
        }


        .box3 {
            background-color: MediumSeaGreen;
            border: 4px dotted gray; 
            color: black;
        }
    </style>
</head>
<body>

    <p class="box box1">Hello World</p>
    <p class="box box2">Hello World</p>
    <p class="box box3">Hello World</p>

</body>
</html>
